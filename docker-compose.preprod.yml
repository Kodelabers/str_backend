# Predprodukcija na s-str-02.infodom.hr: sve preko :8085, profil `preprod`, baza `eturizam`.
# Backend je i dalje objavljen na :8086, ali SAMO za dijagnostiku s kutije (curl, psql skripte);
# preglednik ga ne treba — fronta i API dijele origin :8085 preko nginx proxyja.
#
# ZAUZIMA PORTOVE BIVŠEG DEV STACKA. Dev MORA biti oboren prije `up`:
#   docker compose --env-file .env.dev down
# `docker-compose.yml` i `.env.dev` ostaju netaknuti, pa je dev okolina (jedina s koje je eGOP
# dohvatljiv) resurektabilna jednim `up`-om nakon što se preprod obori. Vidi DEPLOY-PREPROD.md.
#
# `name:` je OBAVEZAN. Bez njega compose izvodi ime projekta iz direktorija (`str_backend`), pa
# bi se servisi `backend`/`frontend` poklopili s dev projektom u istom direktoriju i `up` bi
# rekreirao dev kontejnere umjesto da digne nove.
#
# Prereqs na kutiji:
#   1. Repos u /home/vviskov/str-deploy/str_backend i .../str_frontend (postojeći dev checkout)
#   2. cp .env.preprod.example .env.preprod pa upisati tajne (5 vrijednosti)
#   3. Keystore produkcijskog NIAS-a u /home/vviskov/str-secrets/nias-prod.p12
#   4. Shema `str_rn` postoji u bazi `eturizam` (na preprod profilu je NITKO ne kreira —
#      LocalDatabaseConfig radi samo na local/mock)
#
# Run:
#   sudo docker compose -f docker-compose.preprod.yml --env-file .env.preprod up -d --build
#   sudo docker compose -f docker-compose.preprod.yml logs -f backend
name: str-preprod

services:
  backend:
    build:
      context: .
    container_name: str-backend-preprod
    restart: unless-stopped
    ports:
      - "8086:8080"
    # Sve iz .env.preprod ulazi u kontejner odavde. Kroz env_file, a NE kao `${VAR:-}` u
    # `environment:`: ondje bi nepostavljen ključ u kontejner ušao kao PRAZNA ali POSTAVLJENA
    # varijabla, a Spring default iz `${VAR:default}` vrijedi samo kad varijabla NE POSTOJI —
    # prazna bi ga pregazila (npr. obrisala NIAS entity-id ili DB URL).
    env_file:
      - .env.preprod
    # `environment:` ima prednost nad env_file i drži ono što je na ovoj okolini fiksno.
    environment:
      SPRING_PROFILES_ACTIVE: preprod
      APP_CORS_ALLOWED_ORIGINS: http://s-str-02.infodom.hr:8085
      APP_FRONTEND_BASE_URL: http://s-str-02.infodom.hr:8085
      APP_MAIL_LOGIN_URL: http://s-str-02.infodom.hr:8085/login
      # SAML endpointi idu istim putem kao API — nginx ih proxya, pa i prijava treba samo
      # :8085. NIAS postuje AssertionConsumerServiceURL iz AuthnRequesta (dokazano: assertion
      # je stizao na nas ACS), pa promjena porta ne trazi nista s njihove strane.
      NIAS_ACS_URL: http://s-str-02.infodom.hr:8085/login/saml2/sso/nias
      NIAS_SLO_URL: http://s-str-02.infodom.hr:8085/logout/saml2/slo/nias
      # --- ALTCHA: UGAŠENA, i to MORA pratiti VITE_CAPTCHA_ENABLED kod frontenda ---
      # ALTCHA rješava proof-of-work preko Web Crypto (crypto.subtle), koji postoji SAMO u
      # sigurnom kontekstu — https ili localhost. Ova okolina je na plain HTTP-u, pa widget javi
      # „Secure context (HTTPS) required" i nikad ne dođe do riješenog stanja. Nema konfiguracije
      # koja to zaobilazi; jedini pravi popravak je HTTPS pred okolinom.
      #
      # Dva prekidača stoje jedan uz drugi namjerno: razidu li se, okolina je neupotrebljiva.
      # Samo backend ugašen  => forma blokira slanje jer traži riješenu captchu.
      # Samo frontend ugašen => svaki formular vraća 422 „Potrebna je ALTCHA provjera".
      APP_CAPTCHA_ENABLED: "false"
    # /secrets je isti mount kao na dev stacku; postojeći nias-sp.jks se ne dira, uz njega
    # stoji nias-prod.p12 (produkcijski NIAS certifikat).
    volumes:
      - ${PREPROD_SECRETS_DIR:-/home/vviskov/str-secrets}:/secrets:ro
    # extra_hosts za egop2builder se NE prenosi — eGOP je na predprodukciji ugašen.

  frontend:
    build:
      context: ../str_frontend
      args:
        # JEDAN ORIGIN: fronta i API idu preko :8085, kao na CDU. nginx u ovom containeru
        # vec proxya /api/, /saml2/, /login/saml2/ i /logout/saml2/ na backend:8080.
        #
        # Prije je ovdje bio :8086 (backend izravno). To znaci da preglednik mora dosegnuti
        # DVA porta: :8085 za stranicu i :8086 za svaki XHR. Kome je :8086 zatvoren, stranica
        # se ucita a svi pozivi padnu kao crveni zahtjevi BEZ statusnog koda — nema odgovora
        # koji bi status nosio, pa ni traga u backend logu. Uz jedan origin otpada i CORS.
        VITE_API_URL: http://s-str-02.infodom.hr:8085
        VITE_USE_MOCK: "false"
        VITE_NIAS_ENABLED: "true"
        # Mora pratiti APP_CAPTCHA_ENABLED kod backenda — vidi objašnjenje ondje.
        VITE_CAPTCHA_ENABLED: "false"
    container_name: str-frontend-preprod
    restart: unless-stopped
    environment:
      PORT: "80"
    ports:
      - "8085:80"
    depends_on:
      - backend
