# CDU PREDPRODUKCIJA (kutija 172.20.8.143) — jedan origin preko nginxa u frontend kontejneru.
# Javni ulaz: https://str-preprod-eturizam.gov.hr (SSL offload na gatewayu → host :8085).
# Backend NIJE objavljen na hostu — dohvatljiv je samo preko compose mreže.
#
# `name:` je OBAVEZAN. Bez njega compose izvodi ime projekta iz direktorija (`str_backend`), pa bi
# se servisi `backend`/`frontend` poklopili s drugim stackom u istom checkoutu i `up` bi rekreirao
# tuđe kontejnere umjesto da digne nove.
#
# Preduvjeti na kutiji:
#   1. Repos u /srv/str-preprod/str_backend i /srv/str-preprod/str_frontend
#   2. cp .env.cdupreprod.example .env.cdupreprod pa upisati tajne (5 vrijednosti)
#   3. Produkcijski NIAS keystore u /srv/str-preprod/secrets/nias-prod.p12
#   4. Shema `str_rn` postoji u bazi (na ovom profilu je NITKO ne kreira — vidi
#      tools/cdupreprod-bootstrap.sql i DEPLOY-CDU-PREPROD.md §C3)
#
# Pokretanje:
#   docker compose -f docker-compose.cdupreprod.yml --env-file .env.cdupreprod up -d --build
#   docker compose -f docker-compose.cdupreprod.yml logs -f backend
name: str-cdupreprod

services:
  backend:
    build:
      context: .
      # Dvije build strategije, bez druge compose datoteke:
      #   Dockerfile          (default) — build-on-box: maven u kontejneru radi `mvn package`.
      #   Dockerfile.artifact           — kutija nema maven/Docker Hub: jar se builda lokalno i
      #                                   donese scp-om u target/, image ga samo COPY-a.
      # Prebacuje se retkom BACKEND_DOCKERFILE=Dockerfile.artifact u .env.cdupreprod.
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
    container_name: str-backend-cdupreprod
    restart: unless-stopped
    expose:
      - "8080"
    # Sve iz .env.cdupreprod ulazi u kontejner odavde. Kroz env_file, a NE kao `${VAR:-}` u
    # `environment:`: ondje bi nepostavljen ključ u kontejner ušao kao PRAZNA ali POSTAVLJENA
    # varijabla, a Spring default iz `${VAR:default}` vrijedi samo kad varijabla NE POSTOJI —
    # prazna bi ga pregazila (npr. obrisala NIAS entity-id ili DB URL).
    env_file:
      - .env.cdupreprod
    # `environment:` ima prednost nad env_file i drži ono što je na ovoj okolini fiksno.
    environment:
      SPRING_PROFILES_ACTIVE: cdupreprod
      APP_CORS_ALLOWED_ORIGINS: https://str-preprod-eturizam.gov.hr
      APP_FRONTEND_BASE_URL: https://str-preprod-eturizam.gov.hr
      APP_MAIL_LOGIN_URL: https://str-preprod-eturizam.gov.hr/login
      # ALTCHA radi jer je okolina iza HTTPS-a (Web Crypto traži sigurni kontekst). Ovaj prekidač
      # MORA pratiti VITE_CAPTCHA_ENABLED kod frontenda: razidu li se, okolina je neupotrebljiva
      # (samo BE ugašen => forma traži riješenu captchu; samo FE ugašen => svaki formular 422).
      APP_CAPTCHA_ENABLED: "true"
      # eGOP: ugašen odlukom. false => EgopConfig, EgopClientImpl, EgopCodebooks i EgopRetryJob se
      # uopće ne instanciraju; aktivan je EgopClientMock. To NE znači da se ništa ne urudžbira —
      # RnIssuedListener i RnLifecycleFilingListener nisu vezani na ovaj prekidač, pa mock upisuje
      # KLASU/URBROJ (bez prefiksa, vidi application-cdupreprod.properties).
      EGOP_ENABLED: "false"
    volumes:
      - ${CDUPREPROD_SECRETS_DIR:-/srv/str-preprod/secrets}:/secrets:ro

  frontend:
    build:
      context: ../str_frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile}
      args:
        # BEZ `/api` sufiksa: backendApi.ts uzima VITE_API_URL kao baseURL, a putanje već počinju
        # s `/api/…`. nginx u ovom kontejneru proxya /api/, /saml2/, /login/saml2/ i /logout/saml2/
        # na backend:8080, pa fronta i API dijele origin i CORS otpada.
        VITE_API_URL: https://str-preprod-eturizam.gov.hr
        VITE_USE_MOCK: "false"
        VITE_NIAS_ENABLED: "true"
        # Mora pratiti APP_CAPTCHA_ENABLED kod backenda. BUILD-TIME argument — promjena traži
        # `--build` frontenda, sam restart je ne mijenja.
        VITE_CAPTCHA_ENABLED: "true"
    container_name: str-frontend-cdupreprod
    restart: unless-stopped
    environment:
      PORT: "80"
    ports:
      - "8085:80"
    depends_on:
      - backend
