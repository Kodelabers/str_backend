# CDU deployment — single-origin via frontend nginx reverse-proxy.
# Public entry: https://str-test-eturizam.gov.hr (SSL offload at gateway → host :8085).
# Backend is NOT exposed on the host — only reachable via the compose network.
#
# POZOR: ovo NIJE datoteka koja se izvršava na CDU. Server ima vlastitu kopiju u
# ~/str-rn/str_backend/ koja nije u repou (build-on-box je zamijenjen scp-om jara —
# vidi DEPLOY-CDU.md). Izmjena ovdje ne stiže na server dok se ne prenese ručno.
# Ova datoteka je referenca i cilj buduće reconciliacije; DEPLOY-CDU.md §5b opisuje
# što na serveru treba dodati.
#
# Prereqs on the server:
#   1. Repos u ~/str-rn/str_backend i ~/str-rn/str_frontend
#   2. Copy .env.cdu.example → .env.cdu and fill in CDU_DB_PASSWORD, DRAFT_ENC_KEY
#   3. Ensure schema `str_rn` exists in db `eturizam` (or that user shorttermrental
#      has CREATE permission so Liquibase can create it)
#
# Run:
#   docker compose --env-file .env.cdu -f docker-compose.cdu.yml up -d --build
#   docker compose -f docker-compose.cdu.yml logs -f

services:
  backend:
    build:
      context: .
    container_name: str-backend-cdu
    restart: unless-stopped
    expose:
      - "8080"
    # Sve ostalo iz .env.cdu ulazi u kontejner odavde — identitet tijela na aktima
    # (STR_TIJELO_*, STR_POTPISNIK_*), eGOP URL-ovi, NIAS URL-ovi, SMTP.
    #
    # Zašto env_file, a ne popis u `environment:`: ondje bi svaki ključ trebao
    # `${VAR:-}`, što u kontejner šalje PRAZNU ali POSTAVLJENU varijablu. Spring
    # default iz `${VAR:default}` uzima samo kad varijabla NE POSTOJI — prazna bi
    # ga pregazila i obrisala npr. eGOP URL-ove i naziv tijela. Kroz env_file
    # nepostavljen ključ jednostavno ne postoji i default vrijedi.
    #
    # `environment:` ispod ima prednost nad env_file i drži ono što je na CDU fiksno.
    env_file:
      - .env.cdu
    environment:
      SPRING_PROFILES_ACTIVE: cdu
      CDU_DB_URL: ${CDU_DB_URL:-jdbc:postgresql://172.20.8.196:5432/eturizam}
      CDU_DB_USERNAME: ${CDU_DB_USERNAME:-shorttermrental}
      CDU_DB_PASSWORD: ${CDU_DB_PASSWORD}
      DRAFT_ENC_KEY: ${DRAFT_ENC_KEY}
      APP_CORS_ALLOWED_ORIGINS: https://str-test-eturizam.gov.hr
      APP_FRONTEND_BASE_URL: https://str-test-eturizam.gov.hr
      APP_MAIL_LOGIN_URL: https://str-test-eturizam.gov.hr/login
      NIAS_KEYSTORE_PASSWORD: ${NIAS_KEYSTORE_PASSWORD:-niassp2024}
      # eGOP (uredsko poslovanje MINT-a). Ostaje ugašen dok se ne potvrdi dohvatljivost
      # egopeaitest.mint.hr s ove kutije; bez ovih varijabli radi EgopClientMock.
      EGOP_ENABLED: ${EGOP_ENABLED:-false}
      # Adresa eGOP-a; prazna je bezopasna jer je i Spring default prazan, a uz
      # EGOP_ENABLED=true bez nje aplikacija namjerno ne krene (requireComplete).
      EGOP_BASE_URL: ${EGOP_BASE_URL:-}
      EGOP_USERNAME: ${EGOP_USERNAME:-}
      EGOP_PASSWORD: ${EGOP_PASSWORD:-}
      EGOP_APP_DOMAIN: ${EGOP_APP_DOMAIN:-INFODOM}
      EGOP_APP_USERNAME: ${EGOP_APP_USERNAME:-strservis}
      EGOP_RJESAVATELJ: ${EGOP_RJESAVATELJ:-}
      EGOP_CODEBOOKS_FAIL_FAST: ${EGOP_CODEBOOKS_FAIL_FAST:-false}
      EGOP_TRACE_SOAP: ${EGOP_TRACE_SOAP:-false}
    volumes:
      - ${CDU_SECRETS_DIR:-/home/vviskov/str-secrets}:/secrets:ro

  frontend:
    build:
      context: ../str_frontend
      args:
        VITE_API_URL: https://str-test-eturizam.gov.hr/api
        VITE_USE_MOCK: "false"
        VITE_NIAS_ENABLED: "true"
    container_name: str-frontend-cdu
    restart: unless-stopped
    environment:
      PORT: "80"
    ports:
      - "8085:80"
    depends_on:
      - backend
