# InfoDom dev okolina (s-str-02.infodom.hr): frontend :8085, backend :8086, profil `dev`.
# Jedina okolina s koje je eGOP (http://egop2builder/EAI_MINT) dohvatljiv — CDU ga ne vidi.
#
# Run:
#   docker compose --env-file .env.dev up -d --build
#   docker compose logs -f backend
services:
  backend:
    build:
      context: .
    container_name: str-backend
    restart: unless-stopped
    ports:
      - "8086:8080"
    # Sve iz .env.dev ulazi u kontejner odavde (EGOP_*, tajne). Kroz env_file, a NE kao
    # `${VAR:-}` u `environment:`: ondje bi nepostavljen ključ u kontejner ušao kao PRAZNA
    # ali POSTAVLJENA varijabla, a Spring default iz `${VAR:default}` vrijedi samo kad
    # varijabla NE POSTOJI — prazna bi ga pregazila (npr. obrisala eGOP base URL).
    env_file:
      - .env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      APP_MAIL_LOGIN_URL: http://s-str-02.infodom.hr:8085/login
      APP_CORS_ALLOWED_ORIGINS: http://s-str-02.infodom.hr:8085
      DRAFT_ENC_KEY: ${DRAFT_ENC_KEY}
    volumes:
      - /home/vviskov/str-secrets:/secrets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      # eGOP je na single-label hostu (`egop2builder`), kakav se u Linux kontejneru najčešće
      # NE razrješava — hostov NetBIOS/WINS ne nasljeđuje se, a search domena ne pomaže ako
      # host nema FQDN. Provjera na kutiji:
      #     docker exec str-backend getent hosts egop2builder
      # Ako je prazno, odkomentirati s IP-om iz `nslookup egop2builder` na hostu:
      # - "egop2builder:10.0.0.0"

  frontend:
    build:
      context: ../str_frontend
      args:
        VITE_API_URL: http://s-str-02.infodom.hr:8086
        VITE_USE_MOCK: "false"
        VITE_NIAS_ENABLED: "true"
    container_name: str-frontend
    restart: unless-stopped
    environment:
      PORT: "80"
    ports:
      - "8085:80"
    depends_on:
      - backend
