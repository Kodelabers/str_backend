services:
  backend:
    build:
      context: .
    container_name: str-backend
    restart: unless-stopped
    ports:
      - "8086:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PROD_DB_URL: jdbc:postgresql://host.docker.internal:5431/str2?currentSchema=str_rn
      PROD_DB_USERNAME: ${PROD_DB_USERNAME}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-25}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-eturizam@mints.hr}
      APP_MAIL_LOGIN_URL: http://s-str-02.infodom.hr:8085/login
      APP_CORS_ALLOWED_ORIGINS: http://s-str-02.infodom.hr:8085
      DRAFT_ENC_KEY: ${DRAFT_ENC_KEY}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ../str_frontend
      args:
        VITE_API_URL: http://s-str-02.infodom.hr:8086
        VITE_USE_MOCK: "false"
    container_name: str-frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend
