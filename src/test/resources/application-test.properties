# Test profile - H2 in-memory; Hibernate creates tables from entities (Liquibase disabled)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.sql.init.schema-locations=classpath:test-schema.sql
spring.sql.init.mode=always
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=false

# Liquibase disabled in tests — JPA creates tables from entities against H2
spring.liquibase.enabled=false

# Spring Session JDBC disabled in tests — str_rn.spring_session table (Liquibase 024) is absent in H2,
# so authenticated requests can't persist a session. Excluding the autoconfig falls back to the
# servlet container's in-memory HttpSession.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# Mail disabled in JUnit — LoggingEmailService is wired instead of SMTP
app.mail.enabled=false
