# Test profile - H2 in-memory; Hibernate cilja H2 dialect (override iz application.properties).
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS core\\;CREATE SCHEMA IF NOT EXISTS str
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Override main application.properties postgres dialect — testovi ciljaju H2.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=false

# Liquibase disabled in tests - JPA creates tables from entities against H2
spring.liquibase.enabled=false
