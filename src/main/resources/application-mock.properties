# Mock profile — Railway PostgreSQL with mocked str schema.
# Railway injects PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD automatically
# when a Postgres service is linked to this app.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# str_rn schema created by LocalDatabaseConfig before Liquibase runs;
# context=local activates mock str schema + seed data changesets
spring.liquibase.default-schema=str_rn
spring.liquibase.contexts=local

spring.jpa.show-sql=false
logging.level.com.str.backend=DEBUG
logging.level.liquibase=INFO

# Mail disabled — Railway cannot reach Infodom internal SMTP. Emails are logged only.
app.mail.enabled=false

# Cadastral municipality lookup — only available on local/mock where changeset 109 seeds kat_opcina_naziv
app.cadastral.enabled=true

# Cross-origin session cookie — required for Railway (HTTPS, different domain from frontend)
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

# Mock NIAS demo: fiksni OIB koji /api/nias/* koristi kad nema prave SAML sesije.
# Seedan u changesetu 048 s 3 ACTIVE RB-a.
nias.mock.fixed-oib=99999999990

# e-Ovlastenja mock: mock NIAS osoba zastupa jednu testnu tvrtku (OIB s ispravnom kontrolnom
# znamenkom, iz FINA primjera). Svaki drugi par daje "niste zastupnik".
app.eovlastenja.mock[0].person-oib=99999999990
app.eovlastenja.mock[0].legal-oib=33333333360
app.eovlastenja.mock[0].legal-name=TESTNA TVRTKA d.o.o.
app.eovlastenja.mock[0].function=Direktor
# T13: obrt (IZVOR_REG 2) i OPG (IZVOR_REG 3) za istu mock osobu — popis i odabir nude i njih.
app.eovlastenja.mock[1].person-oib=99999999990
app.eovlastenja.mock[1].legal-oib=44444444446
app.eovlastenja.mock[1].legal-name=TESTNI OBRT
app.eovlastenja.mock[1].function=Vlasnik
app.eovlastenja.mock[1].izvor-reg=2
app.eovlastenja.mock[2].person-oib=99999999990
app.eovlastenja.mock[2].legal-oib=55555555551
app.eovlastenja.mock[2].legal-name=OPG TESTNI
app.eovlastenja.mock[2].function=Nositelj
app.eovlastenja.mock[2].izvor-reg=3
