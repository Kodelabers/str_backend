# Predprodukcija — InfoDom kutija s-str-02.infodom.hr, produkcijski dump u bazi `eturizam`.
# Zauzima portove FE :8085 / BE :8086, tj. mjesto bivše dev okoline (koja se gasi).
# `dev` profil, docker-compose.yml i .env.dev ostaju u repou za povratak na eGOP testiranje —
# s-str-02 je jedina kutija s koje je egop2builder dohvatljiv.
#
# Model je application-cdu.properties, a NE application-dev.properties: dev ima tajne tvrdo
# upisane u gitu, što se ovdje ne ponavlja. Sve što se po okolinama razlikuje ide kroz ${ENV:...}.

# --- baza ---------------------------------------------------------------------------------
# currentSchema=str_rn + SET ROLE str_owner: objekti u str_rn su u vlasništvu str_owner, a
# aplikacijski user je samo član te role. `options` mora biti URL-encodiran (%20 = razmak,
# %3D = '='); pgjdbc dekodira vrijednost i predaje je kao startup opciju konekcije.
# Bez članstva u str_owner konekcija pada već na handshakeu, ne na prvom upitu.
spring.datasource.url=${PREPROD_DB_URL:jdbc:postgresql://s-str-02.infodom.hr:5431/eturizam?currentSchema=str_rn&options=-c%20role%3Dstr_owner}
spring.datasource.username=${PREPROD_DB_USERNAME}
spring.datasource.password=${PREPROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — kutija je dijeljena (uz nas vrte se str2-*, jti-*, sdep-*), pa ne uzimamo Bootov
# default pool bez gornje granice na lifetime.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# --- Liquibase ----------------------------------------------------------------------------
# `contexts` je popis konteksta pod kojima se vrti, a NE izraz: changeset s context="local"
# (82 mock changeseta za str/rpj_dgu/eturizam_test) ne matcha jer "local" nije na popisu.
# Isto vrijedi za context="dev" (043-seed-dev-activity) i context="cdu" (120-seed-cdu-activity).
# Changeseti bez konteksta idu uvijek. Ni jedan demo seed ne smije dirati produkcijski dump.
spring.liquibase.default-schema=str_rn
spring.liquibase.contexts=preprod

spring.jpa.show-sql=false
logging.level.com.str.backend=INFO
logging.level.liquibase=INFO

# --- e-pošta: OBAVEZNO UGAŠENA ------------------------------------------------------------
# U dumpu su PRAVE adrese iznajmljivača. Bazni `app.mail.enabled=true` uz dohvatljiv
# S-SMTP-01.infodom.hr znači da bi predprodukcija slala stvarne mailove stvarnim ljudima
# (odobrenje/odbijanje registracije iznajmljivača, akti iz SuspensionDeadlineJob-a).
# S false radi LoggingEmailService i poruke idu samo u log.
app.mail.enabled=${APP_MAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:S-SMTP-01.infodom.hr}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${APP_MAIL_FROM:s-str-02@infodom.hr}
app.mail.login-url=${APP_MAIL_LOGIN_URL:http://s-str-02.infodom.hr:8085/login}

# --- FE / CORS ----------------------------------------------------------------------------
# FE (8085) i BE (8086) su različiti origini pa je CORS nužan. Za cookie SameSite port NIJE
# dio "sitea", pa su FE<->BE pozivi same-site i sesija radi bez SameSite=None.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://s-str-02.infodom.hr:8085}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://s-str-02.infodom.hr:8085}

# --- NIAS: PRODUKCIJSKI -------------------------------------------------------------------
# IdP entityID i SSO/SLO odredišta se NE konfiguriraju — čitaju se iz metadate
# (RelyingPartyRegistrations.fromMetadataLocation u NiasSamlConfig). Provjereno u
# https://nias.gov.hr/metadata (09.09.2026.):
#   IdP entityID : CN=niasap, L=ZAGREB, OID.2.5.4.97=HR85821130368, O=FINA, C=HR
#   SSO  (POST)  : https://nias.gov.hr/sso-http
#   SLO  (POST)  : https://nias.gov.hr/ssout-http
#   SLO  (SOAP)  : https://nias.gov.hr/ssout-soap
# Metadata se dohvaća PRI DIZANJU KONTEKSTA — ako kutija ne vidi nias.gov.hr, aplikacija ne
# krene (isti način na koji je dev padao na https://niastst.fina.hr/metadata). Preflight je u
# DEPLOY-PREPROD.md §2.
nias.saml.enabled=${NIAS_SAML_ENABLED:true}
nias.saml.metadata-uri=${NIAS_METADATA_URI:https://nias.gov.hr/metadata}
# entity-id = Subject DN certifikata kojim se predstavljamo. NIAS ne čita SP metadatu, nego ima
# hardkodiranu konfiguraciju vezanu uz certifikat — certifikat JE identitet servisa. Namjerno
# bez defaulta: ugrađena vrijednost bi tiho sakrila da DN nije prepisan iz keystorea.
#
# Vrijednost je u .env.preprod.example. Keystore od 09.09.2026. i dalje nosi POSUĐENI identitet
# „InterniTurizam" (OID.2.5.4.97=HR87892589782); nov je samo CA — produkcijski Fina RDC 2020
# umjesto demo. Prijava time radi, ODJAVA NE MOŽE (callback ide na URL registriran uz taj cert).
# Cert istječe 08.11.2026. Vidi DEPLOY-PREPROD.md §0.
nias.saml.entity-id=${NIAS_ENTITY_ID}
# NiasSamlConfig učitava keystore kao PKCS12 i alias koristi i za certifikat i za privatni
# ključ. Oboje se čita iz `keytool -list -v` ispisa (Alias name / Owner).
# Gdje se čuva odlazni AuthnRequest do povratka s NIAS-a. `session` (Springov default) traži da
# sesijski cookie preživi NIAS-ov CROSS-SITE POST na naš ACS — a preglednik na takvom POST-u ne
# šalje SameSite=Lax cookie, dok SameSite=None traži Secure, koji preko plain HTTP-a otpada.
# Zato je ovdje `database`: zahtjev se pamti u str_rn.saml_auth_request i traži po InResponseTo,
# pa cookie uopće nije potreban. Korelacija zahtjev↔odgovor ostaje, replay zaštita se ne skida.
# Kad okolina dobije HTTPS, može se vratiti na `session` bez ijedne druge izmjene.
nias.saml.request-store=${NIAS_REQUEST_STORE:database}
nias.saml.keystore-path=${NIAS_KEYSTORE_PATH:/secrets/nias-prod.p12}
nias.saml.keystore-password=${NIAS_KEYSTORE_PASSWORD}
nias.saml.key-alias=${NIAS_KEY_ALIAS}
# Iste putanje kao na bivšoj dev okolini (isti host i port). MORAJU odgovarati onome što je
# NIAS registrirao uz novi certifikat — NIAS ignorira što pošaljemo i callback vraća na
# registrirani URL.
nias.saml.acs-url=${NIAS_ACS_URL:http://s-str-02.infodom.hr:8086/login/saml2/sso/nias}
nias.saml.slo-url=${NIAS_SLO_URL:http://s-str-02.infodom.hr:8086/logout/saml2/slo/nias}
nias.saml.success-redirect-url=${NIAS_SUCCESS_REDIRECT_URL:http://s-str-02.infodom.hr:8085/registration-number}
# Bez ovoga AuthenticationFailureHandler radi sendRedirect(null) i pada s NPE na svakoj
# neuspjeloj prijavi. Na `dev` profilu ovaj property fali — ne ponavljati.
nias.saml.failure-redirect-url=${NIAS_FAILURE_REDIRECT_URL:http://s-str-02.infodom.hr:8085/?nias_error=true}
# Spec korak 12: kamo korisnik završi nakon što NIAS vrati LogoutResponse.
nias.saml.logout-redirect-url=${NIAS_LOGOUT_REDIRECT_URL:http://s-str-02.infodom.hr:8085/}

# NAMJERNO NIJE PRESLIKANO S CDU PROFILA:
#  - server.servlet.session.cookie.secure=true + same-site=none: SameSite=None zahtijeva
#    Secure, a Secure cookie preko plain HTTP-a browser odbacuje => prijava zajamčeno ne bi
#    radila. Vidi DEPLOY-PREPROD.md, „NIAS preko HTTP-a".
#  - server.forward-headers-strategy=framework: pred backendom nema reverse proxyja,
#    BE je izravno objavljen na 8086.
#  - SAML TRACE/DEBUG logiranje: privremena SLO dijagnostika koja ispisuje osobne podatke.
