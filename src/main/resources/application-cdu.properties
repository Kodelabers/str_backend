# CDU test environment — IaaS test box `iaasp2--mints-eturizam--p14` at 172.20.8.158
# Public URL: https://str-test-eturizam.gov.hr (SSL Offload on *.gov.hr at gateway)
# Independent of Infodom (s-str-02) — values here must not depend on s-str-02.

# Postgres — CDU intranet host
spring.datasource.url=${CDU_DB_URL:jdbc:postgresql://172.20.8.196:5432/eturizam}
spring.datasource.username=${CDU_DB_USERNAME}
spring.datasource.password=${CDU_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase — owns str_rn only; no local mocks, no dev seeds
spring.liquibase.default-schema=str_rn
spring.liquibase.contexts=!local,!dev

spring.jpa.show-sql=false
logging.level.com.str.backend=INFO
logging.level.liquibase=INFO

# Reverse-proxy aware (SSL terminated at *.gov.hr gateway → frontend nginx → backend)
server.forward-headers-strategy=framework

# Session cookies — single-origin via nginx proxy on str-test-eturizam.gov.hr
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Mail — placeholder until CDU SMTP relay is confirmed; can be overridden via env
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:noreply@str-test-eturizam.gov.hr}
app.mail.login-url=${APP_MAIL_LOGIN_URL:https://str-test-eturizam.gov.hr/login}

# CORS — single-origin via nginx proxy means same-origin requests; this is a safety net
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://str-test-eturizam.gov.hr}

# Frontend base URL for handoff redirects
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://str-test-eturizam.gov.hr}

# NIAS SAML2 — enabled on CDU (the whole reason for CDU is NIAS reachability).
# Keystore must be mounted at /secrets/nias-sp.jks (volume in docker-compose.cdu.yml).
# ACS / SLO / success URLs go through https://str-test-eturizam.gov.hr because the
# frontend nginx reverse-proxies /login/saml2/, /logout/saml2/ and /saml2/ to backend.
nias.saml.enabled=true
nias.saml.entity-id=${NIAS_ENTITY_ID:niasaptst}
nias.saml.metadata-uri=${NIAS_METADATA_URI:https://niastst.fina.hr/metadata}
nias.saml.acs-url=${NIAS_ACS_URL:https://str-test-eturizam.gov.hr/login/saml2/sso/nias}
nias.saml.slo-url=${NIAS_SLO_URL:https://str-test-eturizam.gov.hr/logout/saml2/slo/nias}
nias.saml.keystore-path=/secrets/nias-sp.jks
nias.saml.keystore-password=${NIAS_KEYSTORE_PASSWORD:niassp2024}
nias.saml.key-alias=${NIAS_KEY_ALIAS:nias-sp}
nias.saml.success-redirect-url=${NIAS_SUCCESS_REDIRECT_URL:https://str-test-eturizam.gov.hr/existing-objects}
