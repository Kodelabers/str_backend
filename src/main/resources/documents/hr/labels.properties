# Hrvatski nazivi enum vrijednosti koje se ispisuju u aktima i mailovima.
#
# Datoteka se čita kao UTF-8 (ZupContextFactory koristi Reader, ne InputStream), pa se
# dijakritika piše izravno — bez \u escapea. Ovdje su nazivi, a ne poruke o greškama;
# poruke API-ja i dalje žive u messages*.properties.
#
# Do sada RnTrigger i RnStatus nisu imali hrvatske nazive nigdje u kodu; i18n/hr.properties
# nije uvezan u MessageSource i piše se bez dijakritike, pa se nije mogao iskoristiti.

# --- RnTrigger: razlog promjene statusa registracijskog broja ---
# Razlozi suspenzije (MINTS). Pišu se malim slovom jer se umeću u rečenicu akta
# („…zbog sljedećeg razloga: ${rn.razlog}.").
trigger.NO_DECISION=za objekt nije izdano rješenje
trigger.DECISION_REVOKED=rješenje je ukinuto
trigger.INCOMPLETE_DOCUMENTATION=nepotpuni i/ili netočni podaci
trigger.INSPECTION=nalaz inspekcijskog nadzora
# Rezervni natpis: uz OTHER je bilješka obavezna (RnService.suspend), pa razlog u aktu dolazi
# iz nje, a ovaj se tekst vidi samo ako bilješka ipak izostane.
trigger.OTHER=drugi razlozi
# Povijesni razlog: više se ne nudi, ali stoji u starim zapisima i aktima.
trigger.CONSENT_EXPIRY=istek suglasnosti suvlasnika
trigger.WITHDRAWAL=povlačenje registracijskog broja
trigger.REVOCATION=opoziv registracijskog broja na zahtjev iznajmljivača
trigger.REACTIVATE=reaktivacija registracijskog broja
trigger.REVOKE_PROPOSAL=obustava postupka suspenzije
trigger.DEADLINE_EXCEEDED=istek roka za očitovanje
# Postupak povlačenja (T12): prijedlog s rokom, obustava, povlačenje istekom roka i uvaženi prigovor.
trigger.WITHDRAWAL_PROPOSAL=prijedlog povlačenja registracijskog broja
trigger.REVOKE_WITHDRAWAL_PROPOSAL=obustava postupka povlačenja
trigger.WITHDRAWAL_DEADLINE_EXCEEDED=istek roka za očitovanje na prijedlog povlačenja
trigger.REINSTATE=uvažen prigovor na povlačenje registracijskog broja

# --- WithdrawalReason: razlog povlačenja po službenoj dužnosti (MINTS) ---
# RnService.proposeWithdrawal upisuje natpis u registration_number_log.reason, a akti prijedloga,
# obustave i povlačenja ga ispisuju u izreci, pa je i ovdje malo početno slovo. Uz OTHER u akt ide
# opis službenika.
povlacenje.razlog.DATA_NOT_CORRECTED=namjerno ili krajnjom nepažnjom nisu ispravljeni podaci
povlacenje.razlog.INVALID_INFORMATION=dostavljene su nevjerodostojne ili nevaljane informacije
povlacenje.razlog.OTHER=drugi razlozi

# --- RnStatus ---
status.ACTIVE=aktivan
status.SUSPENSION_PROPOSED=pred suspenzijom
status.SUSPENDED=suspendiran
status.WITHDRAWAL_PROPOSED=predložen za povlačenje
status.REVOKED=opozvan
status.WITHDRAWN=povučen

# --- Rezervne vrijednosti kad podatak nedostaje ---
# Rok za ispravak kad RnEntity.suspensionDeadline nije postavljen. Novi prijedlog bez roka više
# ne nastaje (RnService.suspend), pa se ovaj tekst vidi samo na aktima starijih predmeta bez
# roka i kad se akt prijedloga renderira nakon što je RB napustio prijedlog (rok se tada
# briše). Uklapa se u rečenicu akta „...s ispravnim podacima i dokumentacijom ${rok.ispravak}"
# i poruke e-pošte — obje vrijednosti nose završnu točku, pa je predložak ne smije dodavati (datum se formatira kao
# „15. kolovoza 2026.", pa bi inače nastala dvostruka točka).
rok.default=u roku od 15 dana od dana dostave ove Obavijesti.
rok.doDatuma=najkasnije do %s
# Stranka bez OIB-a (non-EU iznajmljivač). Čl. 98. st. 2 traži OIB „ako joj je dodijeljen".
stranka.bezOiba=bez dodijeljenog OIB-a
stranka.oibPrefiks=OIB: %s
stranka.zastupnikPredlozak=zastupan po: %s
razlog.nijeNaveden=razlog nije naveden
vrijednost.nepoznata=—

# --- Objekt ---
# Skupina objekta u izreci akata. Ključ je šifra skupine iz registracijskog broja
# (HR + županija(2) + SKUPINA(2) + vrsta(2) + 12). Danas se izdaje samo 00 — domaćinstvo; isti
# naziv ima i obrazac zahtjeva (SubmissionPdfGenerator, „Skupina objekta"). Nova skupina bez
# natpisa daje vidljivu oznaku na aktu i ERROR u logu (ZupContextFactory.skupina).
objekt.skupina.00=Objekti u kojima se pružaju ugostiteljske usluge u domaćinstvu

# --- Blok e-pečata (ispisuje se samo uz str.documents.epecat.enabled=true) ---
# Tekst po uzoru na Poreznu upravu (predložak MINT-a od 11.09.2026.). %s je URL portala za
# provjeru, odnosno naziv tijela. \n je prijelom retka unutar odlomka.
epecat.provjera=Na internet adresi %s možete provjeriti točnost podataka navedenih u ovom elektroničkom zapisu.\nUpisivanjem broja zapisa i kontrolnog broja ili skeniranjem QR koda, sustav će prikazati izvornik ove isprave.
epecat.potvrda=Ukoliko je ova isprava identična prikazanom izvorniku u digitalnom obliku, %s potvrđuje točnost isprave i stanje podataka u trenutku izrade isprave.
