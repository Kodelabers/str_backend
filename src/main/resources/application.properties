# Server
server.port=${PORT:8080}
spring.application.name=str-backend

# Active profile — overridden by SPRING_PROFILES_ACTIVE env var in dev/test/prod
spring.profiles.active=local

# Virtual threads (Project Loom) for I/O-bound workloads
spring.threads.virtual.enabled=true

# JPA / Hibernate — schema is managed by Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# RFC 7807 problem details
spring.mvc.problemdetails.enabled=true

# Spring Session JDBC — store sessions in str_rn schema (table created by Liquibase 024)
spring.session.store-type=jdbc
spring.session.jdbc.table-name=str_rn.spring_session
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# CORS allowed origins for /api/** (comma-separated). Override via APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173}

# Multipart — document images can be several MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=22MB

# Submission drafts — half-filled forms saved as encrypted JSON in str_rn.submission_draft.
# Key MUST be a base64-encoded 32 bytes (AES-256). Override via DRAFT_ENC_KEY in dev/prod.
app.draft.encryption.key=${DRAFT_ENC_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.draft.max-per-owner=10
app.draft.ttl-days=30
app.draft.cleanup-cron=0 30 3 * * *

# Notification emails — sent after admin approves/rejects a lessor registration.
# `enabled=false` swaps in a logging-only mailer (mock profile, JUnit tests).
# Per-profile properties override `app.mail.from` and `app.mail.login-url`.
app.mail.enabled=true
app.mail.from=str-dev@infodom.hr
app.mail.login-url=http://localhost:5173/login

# Logging
logging.level.com.str.backend=INFO
