# Server
server.port=8080
spring.application.name=str-backend

# Active profile — overridden by SPRING_PROFILES_ACTIVE env var in dev/test/prod
spring.profiles.active=local

# Virtual threads (Project Loom) for I/O-bound workloads
spring.threads.virtual.enabled=true

# JPA / Hibernate — schema is managed by Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# RFC 7807 problem details
spring.mvc.problemdetails.enabled=true

# Logging
logging.level.com.str.backend=INFO
