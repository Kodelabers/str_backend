# Server
server.port=${PORT:8080}
spring.application.name=str-backend

# Active profile — overridden by SPRING_PROFILES_ACTIVE env var in dev/test/prod
spring.profiles.active=local

# Virtual threads (Project Loom) for I/O-bound workloads
spring.threads.virtual.enabled=true

# JPA / Hibernate — schema is managed by Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

# RFC 7807 problem details
spring.mvc.problemdetails.enabled=true

# Spring Session JDBC — store sessions in str_rn schema (table created by Liquibase 024)
spring.session.store-type=jdbc
spring.session.jdbc.table-name=str_rn.spring_session
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# CORS allowed origins for /api/** (comma-separated). Override via APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:5173}

# Frontend base URL used by external handoff endpoints (302 redirect target).
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# Multipart — document images can be several MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=22MB

# Submission drafts — half-filled forms saved as encrypted JSON in str_rn.submission_draft.
# Key MUST be a base64-encoded 32 bytes (AES-256). Override via DRAFT_ENC_KEY in dev/prod.
app.draft.encryption.key=${DRAFT_ENC_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
app.draft.max-per-owner=10
app.draft.ttl-days=30
app.draft.cleanup-cron=0 30 3 * * *

# Notification emails — sent after admin approves/rejects a lessor registration.
# `enabled=false` swaps in a logging-only mailer (mock profile, JUnit tests).
# Per-profile properties override `app.mail.from` and `app.mail.login-url`.
app.mail.enabled=true
app.mail.from=str-dev@infodom.hr
app.mail.login-url=http://localhost:5173/login

# OpenAPI / Swagger — scoped to externally-facing prefill endpoint only
springdoc.packages-to-scan=com.str.backend.prefill
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# spring-ws je na classpathu samo kao SOAP *klijent* (eGOP) — ne dižemo servlet za SOAP server
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.webservices.WebServicesAutoConfiguration

# eGOP SOAP klijent (uredsko poslovanje MINT-a). enabled=false => EgopClientMock.
# Pravi klijent (NTLM + SOAP 1.2) se pali s EGOP_ENABLED=true kad stignu kredencijali —
# URL-ovi su iz spec-a (str. 6-7, default = test okruženje; prod: egopeai.mint.hr preko env varijabli).
hr.infodom.str.integration.egop.enabled=${EGOP_ENABLED:false}
# NTLM kredencijali (HTTP sloj) — tajna, isključivo kroz env (vidi .env.cdu.example)
hr.infodom.str.integration.egop.username=${EGOP_USERNAME:}
hr.infodom.str.integration.egop.password=${EGOP_PASSWORD:}
# Aplikacijski identitet (userName u SOAP payloadu) — nije tajna, InfoDom 26.07.2026
hr.infodom.str.integration.egop.app-domain=${EGOP_APP_DOMAIN:INFODOM}
hr.infodom.str.integration.egop.app-username=${EGOP_APP_USERNAME:strservis}
# Kratki timeouti: urudžbiranje ide sinkrono na request threadu, a jedan tok radi do ~7
# SOAP poziva; što ne stigne, pokupi retry job.
hr.infodom.str.integration.egop.connect-timeout-ms=${EGOP_CONNECT_TIMEOUT_MS:5000}
hr.infodom.str.integration.egop.read-timeout-ms=${EGOP_READ_TIMEOUT_MS:15000}
hr.infodom.str.integration.egop.mdm.url=${EGOP_MDM_URL:https://egopeaitest.mint.hr/ServiceMDM.asmx}
hr.infodom.str.integration.egop.pismeno.url=${EGOP_PISMENO_URL:https://egopeaitest.mint.hr/ServicePismeno.asmx}
hr.infodom.str.integration.egop.predmet.url=${EGOP_PREDMET_URL:https://egopeaitest.mint.hr/ServicePredmet.asmx}
hr.infodom.str.integration.egop.subjekt.url=${EGOP_SUBJEKT_URL:https://egopeaitest.mint.hr/ServiceSubjekt.asmx}
# Nazivi iz eGOP šifrarnika (mail InfoDom 22.07.2026) — mapiraju se na šifre preko MDM-a
str.egop.vrsta-predmeta=Izdavanje Registracijskog broja
str.egop.vrsta-pismena-zahtjev=Zahtjev za registracijski broj
str.egop.vrsta-pismena-dodjela=Obavijest o dodjeli registracijskog broja
str.egop.nadlezna-org-jedinica=MINISTARSTVO TURIZMA
# Rješavatelj predmeta — InfoDom (26.07.2026): "mora biti neka osoba s username-om,
# probajte da je to sve strservis". Prazno => koristi se app-domain\app-username.
str.egop.rjesavatelj=${EGOP_RJESAVATELJ:}
# Ako eGOP ne odgovori na dohvat šifrarnika: true => aplikacija se ne diže,
# false => diže se s praznim šifrarnicima i osvježava ih u pozadini.
str.egop.codebooks.fail-fast=${EGOP_CODEBOOKS_FAIL_FAST:true}
str.egop.codebooks.refresh-cron=0 0/30 * * * *
# eGOP retry job (aktivan samo uz enabled=true): ponovno urudžbiranje neuspjelih/nedovršenih
str.egop.retry.cron=0 */2 * * * *
str.egop.retry.max-attempts=10
str.egop.retry.grace=PT5M
str.egop.retry.max-age=P7D
str.egop.retry.batch-size=50
# Eksponencijalni backoff između pokušaja: min(base * 2^(pokusaj-1), max).
# Bez njega 10 pokušaja izgori za 20 minuta i submission trajno ostane FAILED.
str.egop.retry.backoff-base=PT2M
str.egop.retry.backoff-max=PT2H
# „Obavijest o reaktivaciji" nije među 7 vrsta pismena iz InfoDomovog maila (22.07.2026.) i
# nema šifru u eGOP šifrarniku. Predložak i okidač postoje; urudžbiranje se pali tek kad
# InfoDom potvrdi šifru. Iznajmljivač i s ugašenom zastavicom dobiva obavijest e-poštom.
str.egop.urudzbiraj-reaktivaciju=${EGOP_URUDZBIRAJ_REAKTIVACIJU:false}

# ZUP predlošci akata (docs/ZUP-predlosci.md)
# Identitet tijela koje izdaje akt — čl. 98. st. 2 ZUP-a traži naziv i OIB tijela te propis
# o nadležnosti. Vrijednosti nisu potvrđene s MINT-om: OIB je pročitan iz DN-a NIAS certifikata
# (application-cdu.properties), a taj je certifikat posuđen od InterniTurizam. Do potvrde ih
# treba tretirati kao privremene — ZupContextFactory nekonfigurirano polje ispisuje vidljivo
# i logira ERROR, umjesto da ostavi prazninu na aktu.
str.documents.tijelo.naziv=${STR_TIJELO_NAZIV:Ministarstvo turizma i sporta}
str.documents.tijelo.oib=${STR_TIJELO_OIB:}
str.documents.tijelo.adresa=${STR_TIJELO_ADRESA:Prisavlje 14}
str.documents.tijelo.mjesto=${STR_TIJELO_MJESTO:Zagreb}
str.documents.tijelo.ustrojstvena-jedinica=${STR_TIJELO_USTROJ:Uprava za turizam}
str.documents.tijelo.propis-nadleznosti=${STR_TIJELO_PROPIS:}
# Potpisnik (čl. 98. st. 7) — ovlaštena službena osoba.
str.documents.potpisnik.ime=${STR_POTPISNIK_IME:}
str.documents.potpisnik.funkcija=${STR_POTPISNIK_FUNKCIJA:Voditelj postupka}
# Ovjera po čl. 98. st. 8: akt iz informacijskog sustava smije se ovjeriti SAMO kvalificiranim
# elektroničkim pečatom. Dok pečata nema, klauzula se ne ispisuje — inače bi akt tvrdio ovjeru
# koje nema.
str.documents.epecat.enabled=${STR_EPECAT_ENABLED:false}
str.documents.epecat.klauzula=Akt je izdan iz informacijskog sustava i ovjeren kvalificiranim elektroničkim pečatom sukladno članku 98. stavku 8. Zakona o općem upravnom postupku.
# Uputa o pravnom lijeku, po vrsti akta. Pravna narav postupka (upravni sa žalbom / upravnim
# sporom, ili neupravni s prigovorom čelniku) nije potvrđena — zato je tekst konfiguracija, a
# ne dio predloška. Pogrešna uputa po čl. 111. ide na štetu tijela, ne stranke.
str.documents.uputa.suspenzija=nije dopuštena žalba, ali se može pokrenuti upravni spor tužbom nadležnom upravnom sudu u roku od 30 dana od dana dostave ove Obavijesti.
str.documents.uputa.povlacenje=nije dopuštena žalba, ali se može pokrenuti upravni spor tužbom nadležnom upravnom sudu u roku od 30 dana od dana dostave ove Obavijesti.
# true => predlošci se čitaju s diska pri svakom renderu (razvoj), false => cache (produkcija).
str.documents.reload=${STR_DOCUMENTS_RELOAD:false}

# Logging
logging.level.com.str.backend=INFO
