# Local mock database — auto-created by LocalDatabaseConfig on startup.
# Override credentials via env vars: LOCAL_DB_USERNAME, LOCAL_DB_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/str_db_local
spring.datasource.username=${LOCAL_DB_USERNAME:postgres}
spring.datasource.password=${LOCAL_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase tracks its own changelog in str_rn; context=local activates str mock schema/seed
spring.liquibase.default-schema=str_rn
spring.liquibase.contexts=local

spring.jpa.show-sql=false
logging.level.com.str.backend=DEBUG
logging.level.liquibase=INFO

# Mail — Infodom internal relay, open by IP (no auth)
spring.mail.host=S-SMTP-01.infodom.hr
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=str-dev@infodom.hr
app.mail.login-url=http://localhost:5173/login
