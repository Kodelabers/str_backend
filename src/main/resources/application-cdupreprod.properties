# CDU PREDPRODUKCIJA â kutija 172.20.8.143, javni URL https://str-preprod-eturizam.gov.hr
# (SSL offload na *.gov.hr gatewayu â host :8085; isti javni IP kao test, razlikuju se po SNI).
#
# Model je application-cdu.properties, a NE application-preprod.properties:
#   - `preprod` je InfoDomova kutija na PLAIN HTTP-u (otuda `request-store=database`, bez secure
#     cookieja, bez forward-headers) i s InfoDom SMTP-om; niÅ¡ta od toga ovdje ne vrijedi.
#   - ova okolina je iza HTTPS-a i jednog origina, kao CDU test.
#
# Dvije razlike prema CDU testu:
#   1. NIAS je PRODUKCIJSKI (nias.gov.hr + produkcijski FINA certifikat), ne testni FINA.
#   2. BAZA SE RESETIRA SVAKE NOÄI â vidi napomenu kod Liquibasea.

# --- baza ---------------------------------------------------------------------------------
# NAPOMENA: shema i rola su PRETPOSTAVKA (str_rn / str_owner, kao na CDU testu i InfoDom
# preprodu). Uputa je stigla s `currentSchema=xxx` i `role=xxx_owner` â dok DBA ne potvrdi
# toÄna imena, ispravlja se preko CDUPREPROD_DB_URL u .env.cdupreprod, bez rebuilda.
#
# `options` mora ostati URL-encodiran (%20 = razmak, %3D = '='); pgjdbc dekodira vrijednost i
# predaje je kao startup opciju konekcije. Ako user nije Älan role, konekcija pada VEÄ NA
# HANDSHAKEU, ne na prvom upitu.
spring.datasource.url=${CDUPREPROD_DB_URL:jdbc:postgresql://172.20.8.212:5432/eturizam?currentSchema=str_rn&options=-c%20role%3Dstr_owner}
spring.datasource.username=${CDUPREPROD_DB_USERNAME}
spring.datasource.password=${CDUPREPROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP â konzervativno dok DBA ne kaÅ¾e koliko konekcija smijemo (baza je dijeljena).
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# --- Liquibase ----------------------------------------------------------------------------
# `contexts` je popis konteksta pod kojima se vrti, a NE izraz. Namjerno samo `cdupreprod`:
#   - context="local" (82 mock changeseta za str/rpj_dgu/eturizam_test) ne smije ni blizu,
#   - context="dev" (043-seed-dev-activity) isto,
#   - context="cdu" (120-seed-cdu-activity) je UAT seed aktivnosti platformi za DEMO. Ovdje je
#     izostavljen namjerno: veÅ¾e se na postojeÄe ACTIVE RB-ove, pa bi na svjeÅ¾e resetiranoj bazi
#     ionako ubacio nula redaka, a na bazi koja reset preÅ¾ivi ubacio bi izmiÅ¡ljenu aktivnost u
#     okolinu koju se tretira kao skoro-produkcijsku. Treba li demo podatke â dopisati `,cdu`.
# Changeseti bez konteksta idu uvijek.
#
# POZOR â NOÄNI RESET BAZE: ako reset briÅ¡e i shemu str_rn, s njom nestaje i
# `databasechangelog`, pa Liquibase svako jutro vrti CIJELI changelog od nule i registar starta
# prazan. Shemu na ovom profilu NITKO ne kreira (LocalDatabaseConfig radi samo na local/mock) â
# kreira je tools/cdupreprod-bootstrap.sql iz jutarnje skripte. Vidi DEPLOY-CDU-PREPROD.md Â§C3.
spring.liquibase.default-schema=str_rn
spring.liquibase.contexts=cdupreprod

spring.jpa.show-sql=false
logging.level.com.str.backend=INFO
logging.level.liquibase=INFO

# NAMJERNO NIJE PRESLIKANO S CDU PROFILA: SAML TRACE/DEBUG logiranje. To je privremena SLO
# dijagnostika koja u log ispisuje cijeli AuthnResponse (ime, prezime, OIB) â ne na okolinu s
# pravim podacima.

# --- reverse proxy ------------------------------------------------------------------------
# SSL se terminira na *.gov.hr gatewayu â frontend nginx â backend. Bez ovoga aplikacija gradi
# apsolutne URL-ove po http i internom portu.
server.forward-headers-strategy=framework

# Sesijski cookie â jedan origin preko nginx proxyja na str-preprod-eturizam.gov.hr.
# SameSite=None je nuÅ¾an jer NIAS na naÅ¡ ACS Å¡alje CROSS-SITE POST; traÅ¾i Secure, koji ovdje
# postoji (HTTPS). Zato ovdje NE treba `nias.saml.request-store=database` kao na InfoDom preprodu.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none

# --- e-poÅ¡ta: UGAÅ ENA ---------------------------------------------------------------------
# Baza nosi podatke eTurizma (prave adrese i e-mailovi iznajmljivaÄa). S `true` bi okolina slala
# stvarne poruke stvarnim ljudima â odobrenja/odbijanja registracije i akte iz SuspensionDeadlineJob-a.
# S false radi LoggingEmailService i poruke idu samo u log. Ne paliti bez izriÄite odluke.
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:noreply@str-preprod-eturizam.gov.hr}
app.mail.login-url=${APP_MAIL_LOGIN_URL:https://str-preprod-eturizam.gov.hr/login}

# --- FE / CORS ----------------------------------------------------------------------------
# Jedan origin preko nginxa u frontend kontejneru, pa su pozivi same-origin; CORS je sigurnosna mreÅ¾a.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://str-preprod-eturizam.gov.hr}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://str-preprod-eturizam.gov.hr}

# --- NIAS: PRODUKCIJSKI -------------------------------------------------------------------
# IdP entityID i SSO/SLO odrediÅ¡ta se NE konfiguriraju â Äitaju se iz metadate
# (RelyingPartyRegistrations.fromMetadataLocation u NiasSamlConfig). Iz https://nias.gov.hr/metadata:
#   IdP entityID : CN=niasap, L=ZAGREB, OID.2.5.4.97=HR85821130368, O=FINA, C=HR
#   SSO  (POST)  : https://nias.gov.hr/sso-http
#   SLO  (POST)  : https://nias.gov.hr/ssout-http
#   SLO  (SOAP)  : https://nias.gov.hr/ssout-soap
# Metadata se dohvaÄa PRI DIZANJU KONTEKSTA â ako kutija ne vidi nias.gov.hr, aplikacija NE KRENE.
# Preflight je u DEPLOY-CDU-PREPROD.md Â§C1; privremeni izlaz je NIAS_SAML_ENABLED=false.
nias.saml.enabled=${NIAS_SAML_ENABLED:true}
nias.saml.metadata-uri=${NIAS_METADATA_URI:https://nias.gov.hr/metadata}
# entity-id = Subject DN certifikata kojim se predstavljamo. NIAS ne Äita SP metadatu, nego ima
# hardkodiranu konfiguraciju vezanu uz certifikat â certifikat JE identitet servisa. Namjerno bez
# defaulta: ugraÄena vrijednost bi tiho sakrila da DN nije prepisan iz keystorea. Vrijednost je u
# .env.cdupreprod.example.
nias.saml.entity-id=${NIAS_ENTITY_ID}
# PKCS12; alias se koristi i za certifikat i za privatni kljuÄ (oboje iz `keytool -list -v`).
# Produkcijski keystore (Fina RDC 2020) â NE demo keystore s CDU testa (Fina Demo CA 2020).
nias.saml.keystore-path=${NIAS_KEYSTORE_PATH:/secrets/nias-prod.p12}
nias.saml.keystore-password=${NIAS_KEYSTORE_PASSWORD}
nias.saml.key-alias=${NIAS_KEY_ALIAS}
# Gdje se Äuva odlazni AuthnRequest. `session` (Springov default) radi jer je okolina na HTTPS-u,
# pa sesijski cookie smije biti SameSite=None; Secure i preÅ¾ivi NIAS-ov cross-site POST na ACS.
# Na InfoDom preprodu je zbog plain HTTP-a moralo iÄi `database`; ovdje ne treba.
nias.saml.request-store=${NIAS_REQUEST_STORE:session}
# MORAJU odgovarati onome Å¡to je NIAS registrirao uz certifikat â NIAS ignorira Å¡to poÅ¡aljemo u
# LogoutRequestu i callback vraÄa na registrirani URL.
nias.saml.acs-url=${NIAS_ACS_URL:https://str-preprod-eturizam.gov.hr/login/saml2/sso/nias}
nias.saml.slo-url=${NIAS_SLO_URL:https://str-preprod-eturizam.gov.hr/logout/saml2/slo/nias}
nias.saml.success-redirect-url=${NIAS_SUCCESS_REDIRECT_URL:https://str-preprod-eturizam.gov.hr/registration-number}
# Bez ovoga AuthenticationFailureHandler radi sendRedirect(null) i pada s NPE na svakoj neuspjeloj
# prijavi (property fali na `dev` profilu â ne ponavljati).
nias.saml.failure-redirect-url=${NIAS_FAILURE_REDIRECT_URL:https://str-preprod-eturizam.gov.hr/?nias_error=true}
# Spec korak 12: kamo korisnik zavrÅ¡i nakon Å¡to NIAS vrati LogoutResponse (korak 11).
nias.saml.logout-redirect-url=${NIAS_LOGOUT_REDIRECT_URL:https://str-preprod-eturizam.gov.hr/}

