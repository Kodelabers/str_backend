# Production PostgreSQL — credentials injected via env vars
spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
logging.level.com.str.backend=WARN

# Mail — relay configurable via env vars (Infodom S-SMTP-01 or CDU equivalent)
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${APP_MAIL_FROM:eturizam@mints.hr}
app.mail.login-url=${APP_MAIL_LOGIN_URL}

server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
