# Test environment PostgreSQL — credentials injected via env vars
spring.datasource.url=${TEST_DB_URL}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=false
logging.level.com.str.backend=INFO

# Mail — Infodom internal relay (configurable host via env var if CDU side uses different relay)
spring.mail.host=${SPRING_MAIL_HOST:S-SMTP-01.infodom.hr}
spring.mail.port=${SPRING_MAIL_PORT:25}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=${APP_MAIL_FROM:testeduturizam@mints.hr}
app.mail.login-url=${APP_MAIL_LOGIN_URL:https://testeduturizam.gov.hr/login}
