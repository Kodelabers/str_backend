# Dev environment PostgreSQL — shared development database
spring.datasource.url=jdbc:postgresql://s-str-02.infodom.hr:5431/str2
spring.datasource.username=shorttermrental
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase tracks its own changelog in str_rn; local-context changesets (core mocks) are skipped
spring.liquibase.default-schema=str_rn

spring.jpa.show-sql=false
logging.level.com.str.backend=DEBUG
logging.level.liquibase=INFO
